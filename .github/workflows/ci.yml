name: CI

on:
  workflow_call:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: Native tests (Scala 2.12, 2.13, 3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - run: sbt +testFull

  jvm-reference:
    name: JVM reference tests (JDK 8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        id: jdk8
        with:
          distribution: temurin
          java-version: 8
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - name: JDK 8 reference tests (Scala 2.12 and 2.13)
        working-directory: jvm-reference
        env:
          HTTP_SERVER_TEST_JAVA_HOME: ${{ steps.jdk8.outputs.path }}
        run: sbt ';++2.12.21;testFull;++2.13.18;testFull'
