name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - name: Exclude host HTTP server from publishing JDK
        # Scaladoc otherwise loads the JDK's classes instead of this library's TASTy.
        run: |
          jlink --add-modules java.se,jdk.unsupported,jdk.zipfs,jdk.crypto.ec,jdk.compiler,jdk.jartool \
            --output "$RUNNER_TEMP/publishing-jdk"
          echo "JAVA_HOME=$RUNNER_TEMP/publishing-jdk" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/publishing-jdk/bin" >> "$GITHUB_PATH"
      - run: sbt ci-release
        env:
          PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
          PGP_SECRET: ${{ secrets.PGP_SECRET }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
